<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Solar con Líneas de Órbita - Three.js</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #333;
      color: #fff;
    }
    button {
      background-color: #00A8CC;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0088a6;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <button id="toggle-anim">Activar / Pausar Animación</button>
  </div>

  <!-- CDN Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. ESCENA, CÁMARA Y RENDERIZADOR
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      60, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    camera.position.set(0, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. ILUMINACIÓN (Luz en el centro del Sol)
    const sunLight = new THREE.PointLight(0xffffff, 2.5, 300);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // 3. EL SOL
    const sunGeometry = new THREE.SphereGeometry(3.5, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // 4. FUNCIÓN PARA CREAR EL ARO / LÍNEA GUÍA DE ÓRBITA
    function createOrbitLine(radius) {
      const points = [];
      const segments = 128; // Suavidad del aro
      for (let i = 0; i <= segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(
          Math.cos(theta) * radius, 
          0, 
          Math.sin(theta) * radius
        ));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.3 // Opacidad sutil para el aro de la trayectoria
      });
      return new THREE.LineLoop(geometry, material);
    }

    // DATOS DE LOS PLANETAS
    const planetsData = [
      { name: 'Mercurio', size: 0.4, dist: 6.5,  color: 0x888888, roughness: 0.8 },
      { name: 'Venus',    size: 0.7, dist: 9.0,  color: 0xe3bb76, roughness: 0.6 },
      { name: 'Tierra',   size: 0.8, dist: 12.0, color: 0x2288ff, roughness: 0.4 },
      { name: 'Marte',    size: 0.5, dist: 15.0, color: 0xdd4422, roughness: 0.7 },
      { name: 'Júpiter',  size: 1.8, dist: 19.5, color: 0xd4a373, roughness: 0.5 },
      { name: 'Saturno',  size: 1.4, dist: 25.0, color: 0xe0cda9, roughness: 0.5, hasRing: true, ringColor: 0xc2b280 },
      { name: 'Urano',    size: 1.1, dist: 30.5, color: 0x66ccff, roughness: 0.3, hasRing: true, ringColor: 0x88e0ff },
      { name: 'Neptuno',  size: 1.0, dist: 35.5, color: 0x3333cc, roughness: 0.3 }
    ];

    const planetMeshes = [];
    let angles = planetsData.map(() => 0);

    // CREACIÓN DE AROS DE ÓRBITA Y PLANETAS
    planetsData.forEach((data) => {
      // Dibujar el aro de la órbita
      const orbitLine = createOrbitLine(data.dist);
      scene.add(orbitLine);

      // Crear el planeta
      const geometry = new THREE.SphereGeometry(data.size, 32, 32);
      const material = new THREE.MeshStandardMaterial({ 
        color: data.color,
        roughness: data.roughness,
        metalness: 0.1
      });
      const planet = new THREE.Mesh(geometry, material);
      planet.position.x = data.dist;
      scene.add(planet);
      planetMeshes.push(planet);

      // Anillos propios del planeta (Saturno / Urano)
      if (data.hasRing) {
        const ringGeo = new THREE.RingGeometry(data.size + 0.4, data.size + 1.4, 64);
        const ringMat = new THREE.MeshStandardMaterial({ 
          color: data.ringColor, 
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        planet.add(ring);
      }
    });

    // 5. ANIMACIÓN Y RENDER LOOP
    let isAnimated = false;

    const toggleBtn = document.getElementById('toggle-anim');
    toggleBtn.addEventListener('click', () => {
      isAnimated = !isAnimated;
      toggleBtn.innerText = isAnimated ? "Pausar Animación" : "Activar Animación";
    });

    function animate() {
      requestAnimationFrame(animate);

      if (isAnimated) {
        sun.rotation.y += 0.003;

        planetMeshes.forEach((mesh, index) => {
          mesh.rotation.y += 0.01;

          // Desplazamiento preciso siguiendo la guía circular del aro
          angles[index] += 0.008 / (index * 0.4 + 1);
          const radius = planetsData[index].dist;
          mesh.position.x = Math.cos(angles[index]) * radius;
          mesh.position.z = Math.sin(angles[index]) * radius;
        });
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
